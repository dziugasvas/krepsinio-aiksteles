<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Krepšinis Visur</title>
  <link rel="stylesheet" href="css/bendras.css">
</head>
<body>
  <div class="programele">
    <header class="virsus">
      <h1>🏀 Krepšinis <span class="akcentas">Visur</span></h1>
    </header>

    <main class="turinys">
      <!-- Laikinas turinys: pagrindo patikrinimas. 2 žingsnyje čia bus rungtynių sąrašas. -->
      <div class="kortele">
        <h2>Pagrindas veikia ✅</h2>
        <p class="blankus" id="patikrinimas"></p>
        <p style="margin-top: 8px">
          <span class="zyma oranzine">Aukštas</span>
          <span class="zyma zalia">Laisva 1 vieta</span>
          <span class="zyma">Šeimoms</span>
        </p>
      </div>
      <button class="mygtukas platus" onclick="rodytiPranesima('Pranešimai veikia!')">Išbandyti pranešimą</button>
    </main>

    <nav id="navigacija"></nav>
  </div>

  <script src="js/duomenys.js"></script>
  <script src="js/saugykla.js"></script>
  <script src="js/bendras.js"></script>
  <script>
    piestiNavigacija("rungtynes");
    document.getElementById("patikrinimas").textContent =
      `Duomenys įkelti: ${AIKSTELES.length} aikštelės, ${RUNGTYNES.length} rungtynės, ${ZAIDEJAI.length} žaidėjai.`;
  </script>
</body>
</html>
