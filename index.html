<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Krepšinis Visur – Rungtynės</title>
  <link rel="stylesheet" href="css/bendras.css">
  <link rel="stylesheet" href="css/pagrindinis.css">
</head>
<body>
  <div class="programele">
    <header class="virsus">
      <h1>🏀 Krepšinis <span class="akcentas">Visur</span></h1>
    </header>

    <main class="turinys">
      <!-- Vieta, pagal kurią skaičiuojami atstumai (vietoje GPS) -->
      <p class="vieta" id="vieta"></p>

      <!-- Filtrų juosta ir langas (2 užduotis – Skirmantas) -->
      <div class="filtru-juosta">
        <button class="mygtukas antrinis" id="filtru-mygtukas" onclick="atidarytiFiltrus()">⚙️ Filtrai</button>
        <div id="aktyvus-filtrai"></div>
      </div>
      <div id="filtru-langas" class="filtru-langas" hidden></div>

      <!-- Čia JS įdeda rungtynių sąrašą -->
      <div id="rungtyniu-sarasas"></div>
    </main>

    <nav id="navigacija"></nav>
  </div>

  <script src="js/duomenys.js"></script>
  <script src="js/saugykla.js"></script>
  <script src="js/bendras.js"></script>
  <script src="js/pagrindinis.js"></script>
</body>
</html>
